name: Validate Issue Logs

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  validate-logs:
    name: Check for required log links
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'bug')
    steps:
      - name: Apply or clear the needs log label and comment
        uses: actions/github-script@v7
        with:
          script: |
            const NEEDS_LOG_LABEL = "needs log";
            const NAG_COMMENT_MARKER = "<!-- stardrop-validate-issue-logs -->";
            const STALE_COMMENT_MARKER = "<!-- stardrop-stale-needs-log -->";
            const MANAGED_COMMENT_MARKERS = [NAG_COMMENT_MARKER, STALE_COMMENT_MARKER];
            const LOG_GUIDE_URL = "https://floogen.gitbook.io/stardrop/resources/reporting-issues";
            const LOG_REQUIREMENTS = [
              { name: "Stardrop log", pattern: /https?:\/\/(?:www\.)?pastebin\.com\/(?:raw\/)?[A-Za-z0-9]{6,}/ }
            ];

            const NAG_COMMENT_BODY = [
              NAG_COMMENT_MARKER,
              "Thanks for the report! A Stardrop log is required before this can be investigated.",
              "",
              `1. [Locate your Stardrop log](${LOG_GUIDE_URL})`,
              "2. Upload the contents to https://pastebin.com",
              "3. Edit the issue above and paste the resulting link into the **Stardrop log** field",
              "",
              "Editing the issue re-runs this check, so the `" + NEEDS_LOG_LABEL + "` label and this comment will clear on their own once a valid link is present."
            ].join("\n");

            const issue = context.payload.issue;
            const issueBody = issue.body || "";
            const missingLogs = LOG_REQUIREMENTS.filter(requirement => !requirement.pattern.test(issueBody)).map(requirement => requirement.name);
            const hasNeedsLogLabel = issue.labels.some(label => label.name === NEEDS_LOG_LABEL);

            const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, per_page: 100 });
            const managedComments = comments.filter(comment => comment.user.type === "Bot" && MANAGED_COMMENT_MARKERS.some(marker => (comment.body || "").includes(marker)));
            const existingNagComment = managedComments.find(comment => (comment.body || "").includes(NAG_COMMENT_MARKER));

            if (missingLogs.length > 0)
            {
              core.info(`Missing log links: ${missingLogs.join(", ")}`);

              if (hasNeedsLogLabel === false)
              {
                await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, labels: [NEEDS_LOG_LABEL] });
              }

              if (existingNagComment === undefined)
              {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: NAG_COMMENT_BODY });
              }

              return;
            }

            core.info("All required log links are present");

            // Only reopen issues that were closed while still awaiting a log, so deliberate closures stay closed
            if (issue.state === "closed" && hasNeedsLogLabel === true)
            {
              core.info(`Reopening #${issue.number}`);
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: "open" });
            }

            if (hasNeedsLogLabel === true)
            {
              try
              {
                await github.rest.issues.removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, name: NEEDS_LOG_LABEL });
              }
              catch (error)
              {
                // The label may have been removed manually between the event firing and this call
                if (error.status !== 404)
                {
                  throw error;
                }
              }
            }

            for (const managedComment of managedComments)
            {
              try
              {
                await github.rest.issues.deleteComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: managedComment.id });
              }
              catch (error)
              {
                // The comment may have been deleted manually between the listing and this call
                if (error.status !== 404)
                {
                  throw error;
                }
              }
            }
