name: Package Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    - uses: ./.github/workflows/package-and-release.yml
      with:
        tag: nightly
        is-prerelease: 'true'
